version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dcim-postgres
    environment:
      POSTGRES_DB: dcim_platform
      POSTGRES_USER: dcim
      POSTGRES_PASSWORD: dcim123456
    ports:
      - "5432:5432"
    volumes:
      - dcim_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dcim_postgres_data:
